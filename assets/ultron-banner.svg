<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0d1321"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Text glow -->
    <filter id="textglow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Pulse ring -->
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <!-- Circuit line pattern -->
    <pattern id="circuit" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="none"/>
      <circle cx="0" cy="0" r="1" fill="#00ff8833"/>
      <circle cx="60" cy="0" r="1" fill="#00ff8833"/>
      <circle cx="0" cy="60" r="1" fill="#00ff8833"/>
      <circle cx="60" cy="60" r="1" fill="#00ff8833"/>
      <circle cx="30" cy="30" r="1.5" fill="#00ff8822"/>
      <line x1="0" y1="30" x2="15" y2="30" stroke="#00ff8811" stroke-width="0.5"/>
      <line x1="45" y1="30" x2="60" y2="30" stroke="#00ff8811" stroke-width="0.5"/>
      <line x1="30" y1="0" x2="30" y2="15" stroke="#00ff8811" stroke-width="0.5"/>
      <line x1="30" y1="45" x2="30" y2="60" stroke="#00ff8811" stroke-width="0.5"/>
    </pattern>
    <!-- Scan line animation feel -->
    <linearGradient id="scanline" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff8800"/>
      <stop offset="48%" stop-color="#00ff8800"/>
      <stop offset="50%" stop-color="#00ff8808"/>
      <stop offset="52%" stop-color="#00ff8800"/>
      <stop offset="100%" stop-color="#00ff8800"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#circuit)"/>

  <!-- Scanline overlay -->
  <rect width="1200" height="320" fill="url(#scanline)"/>

  <!-- Top border glow -->
  <rect x="0" y="0" width="1200" height="2" fill="#00ff88" opacity="0.6"/>
  <rect x="0" y="1" width="1200" height="1" fill="#00ff88" opacity="0.3" filter="url(#textglow)"/>

  <!-- Bottom border glow -->
  <rect x="0" y="318" width="1200" height="2" fill="#00ff88" opacity="0.6"/>
  <rect x="0" y="319" width="1200" height="1" fill="#00ff88" opacity="0.3" filter="url(#textglow)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="320" fill="#00ff88" opacity="0.4"/>

  <!-- Corner decorations - top left -->
  <polyline points="20,40 20,20 40,20" fill="none" stroke="#00ff88" stroke-width="2" opacity="0.7"/>
  <!-- Corner decorations - top right -->
  <polyline points="1160,20 1180,20 1180,40" fill="none" stroke="#00ff88" stroke-width="2" opacity="0.7"/>
  <!-- Corner decorations - bottom left -->
  <polyline points="20,280 20,300 40,300" fill="none" stroke="#00ff88" stroke-width="2" opacity="0.7"/>
  <!-- Corner decorations - bottom right -->
  <polyline points="1160,300 1180,300 1180,280" fill="none" stroke="#00ff88" stroke-width="2" opacity="0.7"/>

  <!-- Shield / Logo -->
  <g transform="translate(100, 160)">
    <!-- Outer ring pulse -->
    <circle cx="0" cy="0" r="72" fill="url(#pulse)"/>
    <!-- Shield body -->
    <path d="M0,-58 L48,-40 L48,10 Q48,48 0,62 Q-48,48 -48,10 L-48,-40 Z" 
          fill="none" stroke="#00ff88" stroke-width="2.5" filter="url(#glow)"/>
    <path d="M0,-58 L48,-40 L48,10 Q48,48 0,62 Q-48,48 -48,10 L-48,-40 Z" 
          fill="#00ff88" fill-opacity="0.08"/>
    <!-- Inner shield accent -->
    <path d="M0,-44 L36,-30 L36,8 Q36,36 0,48 Q-36,36 -36,8 L-36,-30 Z" 
          fill="none" stroke="#00ff88" stroke-width="1" opacity="0.4"/>
    <!-- U letter in shield -->
    <text x="0" y="14" text-anchor="middle" font-family="'Courier New', monospace" 
          font-size="48" font-weight="bold" fill="#00ff88" filter="url(#textglow)">U</text>
    <!-- Circuit lines on shield -->
    <line x1="-30" y1="-20" x2="-15" y2="-20" stroke="#00ff88" stroke-width="1" opacity="0.5"/>
    <line x1="15" y1="-20" x2="30" y2="-20" stroke="#00ff88" stroke-width="1" opacity="0.5"/>
    <line x1="-30" y1="20" x2="-15" y2="20" stroke="#00ff88" stroke-width="1" opacity="0.5"/>
    <line x1="15" y1="20" x2="30" y2="20" stroke="#00ff88" stroke-width="1" opacity="0.5"/>
    <circle cx="-15" cy="-20" r="2" fill="#00ff88" opacity="0.6"/>
    <circle cx="15" cy="-20" r="2" fill="#00ff88" opacity="0.6"/>
    <circle cx="-15" cy="20" r="2" fill="#00ff88" opacity="0.6"/>
    <circle cx="15" cy="20" r="2" fill="#00ff88" opacity="0.6"/>
  </g>

  <!-- Main title -->
  <text x="200" y="120" font-family="'Courier New', monospace" font-size="72" font-weight="bold"
        fill="#00ff88" filter="url(#textglow)">ULTRON</text>

  <!-- Subtitle -->
  <text x="200" y="152" font-family="'Courier New', monospace" font-size="16" fill="#8899aa" 
        letter-spacing="6">UNIFIED LAYER FOR THREAT RESPONSE</text>

  <!-- Tagline -->
  <text x="200" y="176" font-family="'Courier New', monospace" font-size="14" fill="#556677" 
        letter-spacing="4">OBSERVABILITY &amp; NETWORK DEFENSE</text>

  <!-- Separator line -->
  <line x1="200" y1="192" x2="680" y2="192" stroke="#00ff88" stroke-width="1" opacity="0.3"/>

  <!-- Stats row -->
  <!-- Stat 1: Nodes -->
  <g transform="translate(210, 230)">
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="28" font-weight="bold" fill="#00ff88" filter="url(#textglow)">3</text>
    <text x="0" y="20" font-family="'Courier New', monospace" font-size="11" fill="#667788" letter-spacing="2">RPI NODES</text>
  </g>

  <!-- Stat divider -->
  <line x1="290" y1="215" x2="290" y2="255" stroke="#00ff88" stroke-width="1" opacity="0.2"/>

  <!-- Stat 2: Cost -->
  <g transform="translate(310, 230)">
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="28" font-weight="bold" fill="#00ff88" filter="url(#textglow)">$290</text>
    <text x="0" y="20" font-family="'Courier New', monospace" font-size="11" fill="#667788" letter-spacing="2">TOTAL COST</text>
  </g>

  <!-- Stat divider -->
  <line x1="420" y1="215" x2="420" y2="255" stroke="#00ff88" stroke-width="1" opacity="0.2"/>

  <!-- Stat 3: Risk Score -->
  <g transform="translate(440, 230)">
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="28" font-weight="bold" fill="#00ff88" filter="url(#textglow)">0-100</text>
    <text x="0" y="20" font-family="'Courier New', monospace" font-size="11" fill="#667788" letter-spacing="2">RISK SCORING</text>
  </g>

  <!-- Stat divider -->
  <line x1="560" y1="215" x2="560" y2="255" stroke="#00ff88" stroke-width="1" opacity="0.2"/>

  <!-- Stat 4: Zero Cloud -->
  <g transform="translate(580, 230)">
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="28" font-weight="bold" fill="#00ff88" filter="url(#textglow)">0</text>
    <text x="0" y="20" font-family="'Courier New', monospace" font-size="11" fill="#667788" letter-spacing="2">CLOUD DEPS</text>
  </g>

  <!-- Right side: Status indicators -->
  <!-- Risk band indicators -->
  <g transform="translate(820, 80)">
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="11" fill="#556677" letter-spacing="3">RISK BANDS</text>
    
    <!-- GREEN -->
    <rect x="0" y="16" width="12" height="12" rx="2" fill="#00ff44"/>
    <text x="18" y="26" font-family="'Courier New', monospace" font-size="12" fill="#00ff44">GREEN</text>
    <text x="85" y="26" font-family="'Courier New', monospace" font-size="10" fill="#556677">0-29  Normal</text>
    
    <!-- YELLOW -->
    <rect x="0" y="38" width="12" height="12" rx="2" fill="#ffcc00"/>
    <text x="18" y="48" font-family="'Courier New', monospace" font-size="12" fill="#ffcc00">YELLOW</text>
    <text x="85" y="48" font-family="'Courier New', monospace" font-size="10" fill="#556677">30-59 Defense</text>
    
    <!-- RED -->
    <rect x="0" y="60" width="12" height="12" rx="2" fill="#ff3333"/>
    <text x="18" y="70" font-family="'Courier New', monospace" font-size="12" fill="#ff3333">RED</text>
    <text x="85" y="70" font-family="'Courier New', monospace" font-size="10" fill="#556677">60-84 Critical</text>
    
    <!-- PURPLE -->
    <rect x="0" y="82" width="12" height="12" rx="2" fill="#aa44ff"/>
    <text x="18" y="92" font-family="'Courier New', monospace" font-size="12" fill="#aa44ff">PURPLE</text>
    <text x="85" y="92" font-family="'Courier New', monospace" font-size="10" fill="#556677">85-100 Quarantine</text>
  </g>

  <!-- Right side: Services -->
  <g transform="translate(820, 200)">
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="11" fill="#556677" letter-spacing="3">STACK</text>
    <text x="0" y="20" font-family="'Courier New', monospace" font-size="12" fill="#8899aa">MQTT • Suricata • Cowrie</text>
    <text x="0" y="38" font-family="'Courier New', monospace" font-size="12" fill="#8899aa">nmap • Nuclei • Lynis</text>
    <text x="0" y="56" font-family="'Courier New', monospace" font-size="12" fill="#8899aa">Self-Healing • Dashboard</text>
  </g>

  <!-- Decorative circuit traces -->
  <!-- Top trace -->
  <polyline points="700,30 720,30 730,40 760,40 770,30 800,30" 
            fill="none" stroke="#00ff88" stroke-width="1" opacity="0.2"/>
  <circle cx="700" cy="30" r="2" fill="#00ff88" opacity="0.3"/>
  <circle cx="800" cy="30" r="2" fill="#00ff88" opacity="0.3"/>

  <!-- Bottom trace -->
  <polyline points="700,290 720,290 730,280 760,280 770,290 800,290" 
            fill="none" stroke="#00ff88" stroke-width="1" opacity="0.2"/>
  <circle cx="700" cy="290" r="2" fill="#00ff88" opacity="0.3"/>
  <circle cx="800" cy="290" r="2" fill="#00ff88" opacity="0.3"/>

  <!-- Middle decorative dots -->
  <circle cx="750" cy="160" r="1.5" fill="#00ff88" opacity="0.2"/>
  <circle cx="770" cy="160" r="1.5" fill="#00ff88" opacity="0.15"/>
  <circle cx="790" cy="160" r="1.5" fill="#00ff88" opacity="0.1"/>

  <!-- Horizontal separator in right panel -->
  <line x1="820" y1="190" x2="1100" y2="190" stroke="#00ff88" stroke-width="0.5" opacity="0.15"/>

  <!-- Black Hat Arsenal badge -->
  <g transform="translate(960, 270)">
    <rect x="0" y="0" width="200" height="28" rx="4" fill="#00ff88" fill-opacity="0.08" 
          stroke="#00ff88" stroke-width="0.5" opacity="0.8"/>
    <text x="100" y="18" text-anchor="middle" font-family="'Courier New', monospace" 
          font-size="10" fill="#00ff88" letter-spacing="2">BLACK HAT ASIA 2027</text>
  </g>
</svg>