; ULTRON — ESP32-C3 indicator (OLED score + LED band)
; Wired to Pi4 USB 2.0. Newline-delimited JSON at 115200, ~10 Hz in.
[env:esp32-c3-devkitm-1]
platform  = espressif32
board     = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.9
    bblanchon/ArduinoJson @ ^7.0.4
    ; Pinned exactly rather than ^3.6.0. A caret let this resolve to FastLED
    ; 3.10.8, which does not compile for RISC-V on this toolchain: its own
    ; riscv.cpp.hpp defines fastled_riscv_rmt_experimental_handler without the
    ; `noexcept` that riscv.hpp declares, which is a hard error here. 3.6.0 is
    ; the version this board was written and validated against.
    fastled/FastLED @ 3.6.0
build_flags =
    -D ULTRON_C3_INDICATOR
