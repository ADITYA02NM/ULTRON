; ULTRON — ESP32-C3 indicator (OLED score + NeoPixel band)
; USB 2.0 to Pi4 by default: newline JSON at 115200, ~10 Hz in.
; Optionally also mirrors MQTT when include/secrets.h is present.
[env:esp32-c3-devkitm-1]
platform  = espressif32
board     = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.9
    bblanchon/ArduinoJson @ ^7.0.4
    ; Only compiled in when include/secrets.h exists, but the dependency is
    ; declared unconditionally so enabling the wireless link is a one-file
    ; change and not a build-config change.
    knolleary/PubSubClient @ ^2.8
    ; The LED is a single onboard WS2812 on GPIO8, driven the way the reference
    ; project drives it. Adafruit_NeoPixel replaces FastLED here: FastLED 3.10.8
    ; does not compile for RISC-V on this toolchain (its riscv.cpp.hpp omits a
    ; `noexcept` its own header declares), and one pixel needs none of what
    ; FastLED exists for.
    adafruit/Adafruit NeoPixel @ ^1.12.0
build_flags =
    -D ULTRON_C3_INDICATOR
