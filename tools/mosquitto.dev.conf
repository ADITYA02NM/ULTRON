# ULTRON — local dev broker config (start.sh)
#
# Lets mosquitto run as your normal user (no sudo) on the dev laptop.
# Mirrors what /etc/mosquitto/conf.d/sentinel.conf does on the Pi, but with
# persistence off and no log file, so Ctrl+C leaves nothing behind.
#
# Run manually:  mosquitto -c tools/mosquitto.dev.conf

listener 1883 0.0.0.0
allow_anonymous true
persistence false
