name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite
        working-directory: dashboard
        run: python -m pytest -q

  nodes:
    name: nodes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install node dependencies
        run: pip install pytest pytest-asyncio paho-mqtt pyserial
      - name: Contract and risk engine tests
        run: python -m pytest -q nodes/tests
      - name: Risk engine selftest
        run: python nodes/pi4/risk_engine.py --selftest
      - name: Start a broker for the replay paths
        run: |
          sudo apt-get update && sudo apt-get install -y mosquitto
          printf 'listener 1883 127.0.0.1\nallow_anonymous true\n' > /tmp/mosq.conf
          mosquitto -c /tmp/mosq.conf -d
      - name: Every collector can replay an event
        run: |
          python nodes/pi3a/lan_watch.py --replay
          python nodes/pi3a/wifi_monitor.py --replay
          python nodes/pi3a/suricata_tail.py --replay
          python nodes/pi3a/tripwire_reader.py --replay

  frontend:
    name: frontend (typecheck · tokens · tests · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Design-token lint
        run: npm run check:tokens

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
